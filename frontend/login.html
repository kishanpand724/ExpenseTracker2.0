<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Expense Tracker</title>
    <meta name="backend-url" content="https://expensetracker2-0-jl02.onrender.com">
    <script src="apiConfig.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            font-family: var(--font-family);
        }
        .auth-card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 1rem;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }
        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.925rem;
        }
        .auth-alert {
            display: none;
            padding: 0.875rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .auth-alert.error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .auth-alert.success {
            background-color: #ecfdf5;
            color: #059669;
            border: 1px solid #a7f3d0;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            width: 100%;
            padding: 0.875rem 2.75rem 0.875rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: #ffffff;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        .btn-toggle-pw {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }
        .btn-toggle-pw:hover {
            color: var(--primary);
        }
        .form-row-utility {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }
        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2" />
                    <line x1="2" y1="10" x2="22" y2="10" />
                </svg>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to access your personal expense dashboard</p>
        </div>

        <div id="error-alert" class="auth-alert error"></div>
        <div id="success-alert" class="auth-alert success"></div>

        <form id="login-form" action="login" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" id="toggle-password-btn" class="btn-toggle-pw" title="Show or hide password">
                        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="form-row-utility">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember-me" name="rememberMe" checked>
                        <span>Remember email</span>
                    </label>
                    <a href="#" id="forgot-password-link" class="forgot-link">Forgot password?</a>
                </div>
            </div>

            <button type="submit" id="login-btn" class="btn-submit">
                <span>Sign In</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("login-form");
            const errorAlert = document.getElementById("error-alert");
            const successAlert = document.getElementById("success-alert");
            const loginBtn = document.getElementById("login-btn");
            const forgotLink = document.getElementById("forgot-password-link");
            const togglePwBtn = document.getElementById("toggle-password-btn");
            const passwordInput = document.getElementById("password");
            const emailInput = document.getElementById("email");
            const rememberCheckbox = document.getElementById("remember-me");

            function showError(msg) {
                errorAlert.textContent = msg;
                errorAlert.style.display = "block";
                successAlert.style.display = "none";
            }

            function showSuccess(msg) {
                successAlert.textContent = msg;
                successAlert.style.display = "block";
                errorAlert.style.display = "none";
            }

            // Restore remembered email if available
            try {
                const savedEmail = localStorage.getItem("expense_tracker_email");
                if (savedEmail && emailInput && !emailInput.value) {
                    emailInput.value = savedEmail;
                }
            } catch (e) {}

            // Check URL parameters for status from Java server redirects
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get("registered") === "true") {
                showSuccess("Account registered successfully! Please sign in with your credentials.");
            }
            if (urlParams.get("email")) {
                emailInput.value = decodeURIComponent(urlParams.get("email"));
                if (passwordInput) passwordInput.focus();
            }
            if (urlParams.get("logout") === "true") {
                showSuccess("You have been signed out successfully.");
            } else {
                // If user already has an active session, automatically direct to dashboard
                const sessionCheckUrl = typeof window.getApiUrl === "function" ? window.getApiUrl("session-check") : "session-check";
                const checkHeaders = typeof window.getAuthHeaders === "function"
                    ? window.getAuthHeaders({ "Accept": "application/json", "Cache-Control": "no-cache" })
                    : { "Accept": "application/json", "Cache-Control": "no-cache" };

                fetch(sessionCheckUrl, {
                    method: "GET",
                    credentials: "include",
                    headers: checkHeaders
                })
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    if (data && (data.authenticated === true || data.user_id)) {
                        if (data.token && typeof window.setAuthToken === "function") {
                            window.setAuthToken(data.token);
                        } else if (data.token) {
                            try { localStorage.setItem("expense_tracker_token", data.token); } catch (e) {}
                        }
                        window.location.href = "index.html";
                    }
                })
                .catch(() => {});
            }
            if (urlParams.get("error")) {
                showError(decodeURIComponent(urlParams.get("error")));
            }

            // Toggle password visibility
            if (togglePwBtn && passwordInput) {
                togglePwBtn.addEventListener("click", function () {
                    const isPassword = passwordInput.getAttribute("type") === "password";
                    passwordInput.setAttribute("type", isPassword ? "text" : "password");
                    togglePwBtn.innerHTML = isPassword
                        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
                        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                });
            }

            if (forgotLink) {
                forgotLink.addEventListener("click", function (e) {
                    e.preventDefault();
                    showError("For security, password reset is handled by the system administrator. Please contact support.");
                });
            }

            loginForm.addEventListener("submit", function (e) {
                e.preventDefault();
                errorAlert.style.display = "none";
                successAlert.style.display = "none";

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError("Please enter both email and password.");
                    return;
                }

                // Handle Remember Me
                try {
                    if (rememberCheckbox && rememberCheckbox.checked) {
                        localStorage.setItem("expense_tracker_email", email);
                    } else {
                        localStorage.removeItem("expense_tracker_email");
                    }
                } catch (e) {}

                loginBtn.disabled = true;
                loginBtn.querySelector("span").textContent = "Signing in...";

                // Submit to Login endpoint with session credentials
                const loginUrl = typeof window.getApiUrl === "function" ? window.getApiUrl("login") : "login";
                const loginHeaders = typeof window.getAuthHeaders === "function"
                    ? window.getAuthHeaders({
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                        "Accept": "application/json, text/plain, */*"
                      })
                    : {
                        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                        "Accept": "application/json, text/plain, */*"
                      };

                fetch(loginUrl, {
                    method: "POST",
                    credentials: "include",
                    headers: loginHeaders,
                    body: "email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password)
                })
                .then(async function (response) {
                    const status = response.status;
                    let data = null;
                    let rawText = "";
                    try {
                        rawText = await response.text();
                        data = JSON.parse(rawText);
                    } catch (parseErr) {}
                    return { ok: response.ok, status: status, data: data, rawText: rawText };
                })
                .then(function (res) {
                    loginBtn.disabled = false;
                    loginBtn.querySelector("span").textContent = "Sign In";

                    if (res.ok && res.data && res.data.success) {
                        if (res.data.token && typeof window.setAuthToken === "function") {
                            window.setAuthToken(res.data.token);
                        } else if (res.data.token) {
                            try { localStorage.setItem("expense_tracker_token", res.data.token); } catch (e) {}
                        }
                        if (res.data.user) {
                            try { localStorage.setItem("expense_tracker_user", JSON.stringify(res.data.user)); } catch (e) {}
                        }
                        showSuccess("Login successful! Redirecting to dashboard...");
                        const targetUrl = (res.data && res.data.redirect) ? res.data.redirect : "index.html";
                        setTimeout(function () {
                            window.location.href = targetUrl;
                        }, 400);
                    } else if (res.data && res.data.error) {
                        showError(res.data.error);
                    } else if (res.status === 401) {
                        showError("Invalid email or password. Please verify your credentials.");
                    } else if (res.status === 404) {
                        showError("HTTP 404: Login mapping '/login' not found on server.");
                    } else if (res.status === 405) {
                        showError("HTTP 405: Method Not Allowed. Login endpoint must accept POST.");
                    } else if (res.status === 500) {
                        const preview = res.rawText ? (": " + res.rawText.replace(/<[^>]*>?/gm, ' ').substring(0, 160).trim()) : "";
                        showError("Server Error (500)" + preview);
                    } else {
                        const preview = res.rawText ? (": " + res.rawText.replace(/<[^>]*>?/gm, ' ').substring(0, 160).trim()) : "";
                        showError("Server returned status " + res.status + preview);
                    }
                })
                .catch(function (err) {
                    loginBtn.disabled = false;
                    loginBtn.querySelector("span").textContent = "Sign In";
                    showError("Connection error: " + (err.message || "Failed to connect to server."));
                });
            });
        });
    </script>
</body>
</html>
